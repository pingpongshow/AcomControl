; PlatformIO Project Configuration File
; AcomControl - ACOM 600S Amplifier Controller
; ESP32-S3 DevKit
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor settings
monitor_speed = 115200

; Build flags
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; Upload settings
upload_speed = 921600

; Library dependencies - use explicit GitHub repos to avoid wrong library versions
lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson @ ^6.21.0

; Partition scheme (use default with OTA support)
board_build.partitions = default.csv

; Flash mode
board_build.flash_mode = dio

; CPU Frequency (240MHz for maximum performance)
board_build.f_cpu = 240000000L
