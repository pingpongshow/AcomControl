; PlatformIO Project Configuration File
; AcomControl - ACOM 600S Amplifier Controller
; ESP32-S3 DevKit

[env:esp32-s3-devkitc-1]
; The platform is pinned for the same reason lib_deps are (see below). Leaving
; it bare resolved to whatever "espressif32" points at on the day you built,
; which now means the pioarduino 55.x line and an Arduino 3.x core; this
; firmware is written against the Arduino 2.x core that 6.x ships.
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Build flags
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; Upload settings (USB). For over-the-air updates once v6.0 is running, use:
;   pio run -t upload --upload-port acomcontrol.local
; after uncommenting the two lines below.
upload_speed = 921600
; upload_protocol = espota
; upload_port = acomcontrol.local

; Library dependencies.
; v5.0 declared me-no-dev/ESPAsyncWebServer but actually resolved to the
; ESP32Async fork, so the declared and built sources disagreed. v6.0 named the
; right fork but gave bare git URLs, so "pinned" meant "whatever is on the
; default branch today" - a dependency refresh could pull a breaking major.
; These are the versions this firmware is written against and tested with.
;
; ArduinoJson stays on 6.x: 7.x removes StaticJsonDocument, DynamicJsonDocument
; and containsKey(), all of which this firmware uses.
lib_deps =
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.0
    bblanchon/ArduinoJson @ ~6.21.5

; Partition scheme.
; v6.0 adds LittleFS session logging plus OTA, which does not fit the 1.31 MB
; app slot in default.csv. esp32-s3-devkitc-1 ships with 8 MB flash or more
; (N8/N8R2/N8R8/N16R8), so use the 8 MB layout: 3 MB app x2 + ~1.5 MB LittleFS.
; On a 4 MB board, switch to `min_spiffs.csv` and lower LOG_MAX_BYTES in
; src/main.cpp to about 128 KB.
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
board_build.flash_mode = dio

; CPU Frequency (240 MHz for maximum performance)
board_build.f_cpu = 240000000L
